spring:
  profiles:
    active: local
  application:
    name: lembe-api

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3307/lembe?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: lembe
    password: lembe_pw
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:schema
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  task:
    scheduling:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.lembe
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: local-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-expiry: 3600000      # 1 hour
  refresh-token-expiry: 2592000000  # 30 days

storage:
  type: local
  local:
    base-path: ./uploads
    base-url: http://localhost:8080/files

fcm:
  server-key: ${FCM_SERVER_KEY:mock}   # 발급 전 mock 값

fal:
  api-key: ${FAL_API_KEY:mock}         # TODO: fal.ai 연동 시 실제 키 발급
  enabled: false                       # true로 변경 시 실제 API 호출

server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    com.lembe: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.lembe
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 2592000000

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/files}

fcm:
  server-key: ${FCM_SERVER_KEY:mock}

server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    com.lembe: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.lembe
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 2592000000

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/files}

fcm:
  server-key: ${FCM_SERVER_KEY}

server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    com.lembe: WARN
